name: Publish the walkthrough

# Publishes public/walkthrough/ to GitHub Pages, so the README can link to a copy
# that runs in the browser. It is separate from the app: a deployed Worker still
# serves nothing without a Zero Trust sign-in. See docs/walkthrough.md.

on:
  push:
    branches: [main]
    paths:
      - "public/walkthrough/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public/walkthrough
      - id: deployment
        uses: actions/deploy-pages@v5
